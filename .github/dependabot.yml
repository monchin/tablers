# Copied from https://github.com/pdm-project/pdm/blob/main/.github/dependabot.yml
version: 2
updates:
  # Maintain dependencies for workflow actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "github_actions"
    groups:
      actions:
        patterns:
          - "*"