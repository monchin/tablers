name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install tools
        run: |
          uv tool install pdm
          uv tool install prek

      - name: Install dependencies
        run: pdm sync

      - name: Generate .pyi stub files
        run: pdm run stub

      - name: Run pre-commit checks
        run: prek run --all-files

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install tools
        run: |
          uv tool install pdm
          uv tool install maturin

      - name: Install dependencies
        run: pdm sync

      - name: Run pre-build hook
        run: pdm run python scripts/pre-build.py

      - name: Build with maturin
        run: maturin develop --uv

      - name: Run Rust tests
        run: cargo test

      - name: Run Python tests
        run: pdm run pytest tests/python

      - name: Run post-build hook
        if: always()
        run: pdm run python scripts/post-build.py
