name: Build and Publish Wheels

on:
  push:
    tags:
      - "v*"

jobs:
  # --------------------------------------------------
  # Windows / macOS
  # - PDM + hook
  # - wheel only (no sdist)
  # --------------------------------------------------
  build-windows-macos:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # uv
      - uses: astral-sh/setup-uv@v7

      # Python (abi3 baseline)
      - name: Install Python via uv
        shell: bash
        run: |
          uv python install 3.10
          PY=$(uv python find 3.10)
          echo "PY=$PY" >> $GITHUB_ENV

      # Rust
      - uses: dtolnay/rust-toolchain@stable

      # pdm
      - name: Install pdm
        run: |
          uv tool install pdm

      # Bind Python to PDM
      - name: Configure PDM interpreter
        run: |
          pdm use "$PY" --global

      # Build wheel only
      - name: Build wheel with PDM
        run: |
          pdm build --no-sdist -v

      # Upload artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  # --------------------------------------------------
  # Linux (manylinux)
  # - Build in Docker container to ensure glibc 2.28 compatibility
  # - Docker build ensures proper symbol versions
  # --------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Setup Python for hooks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Run pre-build hook
      - name: Run pre-build hook
        run: python scripts/pre-build.py

      # Build in manylinux_2_28 container using maturin-action
      # This ensures compatibility with modern Linux distributions (glibc 2.28)
      - name: Build manylinux_2_28 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: 2_28
          args: --release --out dist
          rust-toolchain: stable

      # Run post-build hook
      - name: Run post-build hook
        run: python scripts/post-build.py

      # Upload artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-ubuntu-latest
          path: dist/*.whl

  # --------------------------------------------------
  # Publish (once)
  # --------------------------------------------------
  publish:
    needs: [build-windows-macos, build-linux]
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # required for Trusted Publishing

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist

      # flatten dist directory
      - name: Flatten dist
        run: |
          mkdir final_dist
          find dist -type f -name "*.whl" -exec cp {} final_dist/ \;

      - uses: astral-sh/setup-uv@v7

      - name: Install PDM
        run: |
          uv tool install pdm

      - name: Publish to PyPI
        run: |
          pdm publish \
            --no-build \
            --repository pypi \
            --dest final_dist