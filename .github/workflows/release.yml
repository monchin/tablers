name: Build and Publish Wheels

on:
  push:
    tags:
      - "v*"

jobs:
  # --------------------------------------------------
  # Windows / macOS
  # - PDM + hook
  # - wheel only (no sdist)
  # --------------------------------------------------
  build-windows-macos:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # uv
      - uses: astral-sh/setup-uv@v7

      # Python (abi3 baseline)
      - name: Install Python via uv
        shell: bash
        run: |
          uv python install 3.10
          PY=$(uv python find 3.10)
          echo "PY=$PY" >> $GITHUB_ENV

      # Rust
      - uses: dtolnay/rust-toolchain@stable

      # pdm
      - name: Install pdm
        run: |
          uv tool install pdm

      # Bind Python to PDM
      - name: Configure PDM interpreter
        run: |
          pdm use "$PY" --global

      # Generate .pyi stub files
      - name: Generate .pyi stub files
        run: uvx rylai -o python/tablers

      # Build wheel only
      - name: Build wheel with PDM
        run: |
          pdm build --no-sdist -v

      # Upload artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  # --------------------------------------------------
  # Linux (manylinux)
  # - Build in Docker container to ensure glibc 2.28 compatibility
  # - Docker build ensures proper symbol versions
  # --------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Setup Python for hooks
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # Install uv for stub generation
      - uses: astral-sh/setup-uv@v7

      # Generate .pyi stub files
      - name: Generate .pyi stub files
        run: uvx rylai -o python/tablers

      # Run pre-build hook
      - name: Run pre-build hook
        run: python scripts/pre-build.py

      # Build in manylinux_2_28 container using maturin-action
      # This ensures compatibility with modern Linux distributions (glibc 2.28)
      - name: Build manylinux_2_28 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: 2_28
          args: --release --out dist
          rust-toolchain: stable

      # Run post-build hook
      - name: Run post-build hook
        run: python scripts/post-build.py

      # Upload artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-ubuntu-latest
          path: dist/*.whl

  # --------------------------------------------------
  # Publish (once)
  # --------------------------------------------------
  publish:
    needs: [build-windows-macos, build-linux]
    runs-on: ubuntu-latest

    permissions:
      contents: write # GitHub Release
      id-token: write # required for Trusted Publishing

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist

      # flatten dist directory
      - name: Flatten dist
        run: |
          mkdir final_dist
          find dist -type f -name "*.whl" -exec cp {} final_dist/ \;

      - name: Extract changelog for tag
        run: |
          python3 << 'PY'
          import os, re, sys

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          with open("CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()
          pat = rf"(?ms)^## \[{re.escape(version)}\].*?(?=^## \[|\Z)"
          m = re.search(pat, text)
          if not m:
              print(
                  f"No changelog section found for [{version}] (tag {tag})",
                  file=sys.stderr,
              )
              sys.exit(1)
          with open("release_notes.md", "w", encoding="utf-8") as out:
              out.write(m.group(0).strip() + "\n")
          PY

      - uses: astral-sh/setup-uv@v7

      - name: Install PDM
        run: |
          uv tool install pdm

      - name: Publish to PyPI
        run: |
          pdm publish \
            --no-build \
            --repository pypi \
            --dest final_dist

      # Wheels are published to PyPI only; GitHub Release carries changelog only.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
