name: Auto-update pre-commit hooks

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install prek
        run: uv tool install prek

      - name: Run prek auto-update
        run: prek auto-update --cooldown-days 1

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update pre-commit hooks'
          title: 'chore: auto-update pre-commit hooks'
          body: |
            This PR updates the pre-commit hooks to their latest versions.
            
            Changes were automatically generated by running `prek auto-update --cooldown-days 1`.
            
            **Configuration:**
            - Minimum release age: 1 day (cooldown-days)
            - Only versions released at least 1 day ago will be considered
            
            Please review the changes and merge if everything looks good.
          branch: auto-update-pre-commit-hooks
          base: master
          delete-branch: true
          labels: |
            dependencies
            pre-commit
